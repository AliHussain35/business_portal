<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fanks Marine Inspection Services — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0B2545 0%, #13315C 55%, #1C4470 100%);
      height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 14px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 380px;
    }
    .login-brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: #0B2545;
      font-size: 1.15rem;
      line-height: 1.2;
    }
    .login-brand-sub {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #52B2CF;
      font-weight: 600;
    }
    .btn-primary {
      background: #0B2545;
      border-color: #0B2545;
    }
    .btn-primary:hover {
      background: #13315C;
      border-color: #13315C;
    }
    .login-footer {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      text-align: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center px-3">
  <div class="w-100" style="max-width:380px;">
    <div class="login-card">
      <div class="text-center mb-4">
        <svg width="38" height="38" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 3 L15 17" stroke="#0B2545" stroke-width="2" stroke-linecap="round"/>
          <circle cx="15" cy="7" r="3.5" stroke="#0B2545" stroke-width="2"/>
          <path d="M6 15 Q6 22 15 22 Q24 22 24 15" stroke="#0B2545" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 25 Q7.5 22 12 25 Q16.5 28 21 25 Q25.5 22 27 25" stroke="#52B2CF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="login-brand-name mt-2">Fanks Marine Inspection Services</div>
        <div class="login-brand-sub">Operations Portal</div>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <label class="form-label small fw-semibold">Email</label>
        <input class="form-control mb-3" type="email" name="email" placeholder="you@fanksmarine.com" required>
        <label class="form-label small fw-semibold">Password</label>
        <input class="form-control mb-4" type="password" name="password" placeholder="••••••••" required>
        <button class="btn btn-primary w-100 fw-semibold" type="submit">Log in</button>
      </form>
    </div>
    <div class="login-footer">Developed by Ali Hussain, 2026</div>
  </div>
</body>
</html>
