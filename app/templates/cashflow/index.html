{% extends "base.html" %}
{% block content %}
<h3>Cash Flow — Balance: Rs {{ "%.2f"|format(balance) }}</h3>

<form method="post" action="{{ url_for('cashflow.add') }}" class="row g-2 my-3">
  <div class="col-12 col-sm-auto">
    <select name="type" class="form-select">
      <option value="in">Cash In</option>
      <option value="out">Cash Out</option>
    </select>
  </div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" required></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="text" name="category" placeholder="Category"></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="date" name="date" required></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="text" name="description" placeholder="Description"></div>
  <div class="col-12 col-sm-auto"><button class="btn btn-primary">Add</button></div>
</form>

<div class="table-responsive">
<table class="table table-bordered bg-white">
  <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Description</th><th></th></tr></thead>
  <tbody>
    {% for t in transactions %}
    <tr>
      <td>{{ t.date }}</td>
      <td>{{ t.type }}</td>
      <td>{{ t.category }}</td>
      <td>Rs {{ "%.2f"|format(t.amount) }}</td>
      <td>{{ t.description }}</td>
      <td>
        <form method="post" action="{{ url_for('cashflow.delete', transaction_id=t.id) }}">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
