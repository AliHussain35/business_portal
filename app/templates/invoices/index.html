{% extends "base.html" %}
{% block content %}
<h3>Invoices Received</h3>

<form method="post" action="{{ url_for('invoices.add') }}" class="row g-2 my-3">
  <div class="col-12 col-sm-auto"><input class="form-control" type="text" name="vendor_name" placeholder="Vendor" required></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" required></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="date" name="date_received" required></div>
  <div class="col-12 col-sm-auto"><button class="btn btn-primary">Add</button></div>
</form>

<div class="table-responsive">
<table class="table table-bordered bg-white">
  <thead><tr><th>Vendor</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr></thead>
  <tbody>
    {% for inv in invoices %}
    <tr>
      <td>{{ inv.vendor_name }}</td>
      <td>Rs {{ "%.2f"|format(inv.amount) }}</td>
      <td>{{ inv.date_received }}</td>
      <td>{{ inv.status }}</td>
      <td>
        <form method="post" action="{{ url_for('invoices.delete', invoice_id=inv.id) }}">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
