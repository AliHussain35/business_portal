{% extends "base.html" %}
{% block content %}
<h3>Employees</h3>

<form method="post" action="{{ url_for('payroll.add_employee_route') }}" class="row g-2 my-3">
  <div class="col-12 col-sm-auto"><input class="form-control" type="text" name="name" placeholder="Name" required></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="text" name="position" placeholder="Position"></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="number" step="0.01" name="monthly_salary" placeholder="Monthly Salary" required></div>
  <div class="col-12 col-sm-auto"><input class="form-control" type="date" name="join_date"></div>
  <div class="col-12 col-sm-auto"><button class="btn btn-primary">Add</button></div>
</form>

<div class="table-responsive">
<table class="table table-bordered bg-white">
  <thead><tr><th>Name</th><th>Position</th><th>Monthly Salary</th><th>Joined</th></tr></thead>
  <tbody>
    {% for e in employees %}
    <tr>
      <td>{{ e.name }}</td>
      <td>{{ e.position }}</td>
      <td>Rs {{ "%.2f"|format(e.monthly_salary) }}</td>
      <td>{{ e.join_date }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
